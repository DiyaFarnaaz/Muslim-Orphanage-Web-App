<div class="report-container mobile-animate">
  <div class="header-nav">
    <button type="button" (click)="goBack()" class="back-btn">
      &larr; Back
    </button>
  </div>

  <div *ngIf="!isLoading; else loadingTemplate">
    <h2>{{ isEditMode ? 'Edit Session Report' : 'Session Report' }}</h2>
    
    <form (ngSubmit)="submitReport()">
      <div class="form-grid">
        <div class="form-group">
          <label>Session Lead Name</label>
          <input type="text" [(ngModel)]="report.session_lead_name" name="session_lead_name" placeholder="Enter session lead name..." required>
        </div>

        <div class="form-group">
          <label>Topic</label>
          <input type="text" [(ngModel)]="report.topic" name="topic" placeholder="Enter topic...">
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" [(ngModel)]="report.session_date" name="session_date">
        </div>

        <div class="form-group">
          <label>Class Group</label>
          <select [(ngModel)]="report.class_group" name="class_group">
            <option value="" disabled>Select Class Group</option>
            <option *ngFor="let group of classGroups" [value]="group">{{ group }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Activity</label>
          <input type="text" [(ngModel)]="report.activity" name="activity" placeholder="Activity details...">
        </div>

        <div class="form-group">
          <label>Winner</label>
          <input type="text" [(ngModel)]="report.winner" name="winner" placeholder="Winner details...">
        </div>
      </div>

      <div class="form-group full-width">
        <label>Feedback</label>
        <textarea [(ngModel)]="report.feedback" name="feedback" rows="4" placeholder="Enter session feedback..."></textarea>
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Report' : 'Submit Report') }}
      </button>
    </form>
  </div>

  <ng-template #loadingTemplate>
    <div class="loading-state">
      <p>Loading session report details...</p>
    </div>
  </ng-template>
</div>
