<div class="auth-page-wrapper mobile-animate">
  <!-- Back Button Header -->
  <div class="auth-header-nav">
    <button type="button" (click)="goBack()" class="back-btn">&larr; Back</button>
  </div>

  <!-- Centered Reset Password Card -->
  <div class="login-container">
    <div class="login-card">
      <h2>Reset Password</h2>
      
      <!-- STEP 1: Enter Email & Reset Code -->
      <form *ngIf="!tokenVerified" [formGroup]="verifyForm" (ngSubmit)="verifyToken()">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label>Reset Code</label>
          <input type="text" formControlName="token" placeholder="Enter code from email">
        </div>

        <button type="submit" class="btn-submit" [disabled]="verifyForm.invalid">Verify Code</button>
      </form>

      <!-- STEP 2: Enter New Password & Confirm Password -->
      <form *ngIf="tokenVerified" [formGroup]="passwordForm" (ngSubmit)="updatePassword()">
        <div class="input-group">
          <label>New Password</label>
          <input type="password" formControlName="password" placeholder="Enter new password">
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">
        </div>

        <div *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched" class="error-text" style="color: red; font-size: 12px; margin-bottom: 10px;">
          Passwords do not match!
        </div>

        <button type="submit" class="btn-submit" [disabled]="passwordForm.invalid">Update Password</button>
      </form>

    </div>
  </div>
</div>
