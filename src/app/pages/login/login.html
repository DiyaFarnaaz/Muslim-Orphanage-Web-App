<div class="auth-page-wrapper mobile-animate">
  <!-- Back Button Header -->
  <div class="auth-header-nav">
    <button type="button" routerLink="/" class="back-btn">&larr; Back</button>
  </div>

  <!-- Centered Login Card -->
  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      
      <form (submit)="onLogin()">
        <div class="input-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-submit">Login</button>
      </form>

      <div class="auth-actions" style="margin-top: 15px; display: flex; justify-content: space-between;">
        <button type="button" class="btn-link" (click)="onForgotPassword()">Forgot Password?</button>
        <a routerLink="/register">Register</a>
      </div>
    </div>
  </div>
</div>
