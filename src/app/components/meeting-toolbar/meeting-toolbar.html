<div class="meeting-toolbar-corner" (click)="$event.stopPropagation()">
  <button type="button" class="ctrl-btn" (click)="toggleParticipantsClick.emit()" title="Participants">
    👥
    <span class="badge" *ngIf="meeting.participants().length > 0">{{ meeting.participants().length }}</span>
  </button>

  <button type="button" class="ctrl-btn" (click)="meeting.toggleChat()" title="Chat">
    💬
    <span class="badge" *ngIf="meeting.unreadCount() > 0">{{ meeting.unreadCount() }}</span>
  </button>

  <button type="button" class="ctrl-btn" (click)="meeting.minimize()" title="Minimize">▁</button>

  <button type="button" class="ctrl-btn danger" *ngIf="meeting.isAdmin()" (click)="endForAll()" title="End for all">
    ⛔
  </button>
</div>
