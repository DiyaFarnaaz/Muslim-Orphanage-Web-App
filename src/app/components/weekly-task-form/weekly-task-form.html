<div class="page-container">
  <div class="header-nav">
    <button type="button" (click)="goBack()" class="back-btn">← Back</button>
  </div>

  <div class="form-card" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2>{{ isEditMode ? 'Edit Weekly Plan' : 'Add New Weekly Plan' }}</h2>

    <form (ngSubmit)="saveTask()">
      
      <!-- General Details Card with Calendar Pickers -->
      <div class="report-card general-info" style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h3 style="margin-bottom: 10px; color: #334155;">General Details (Date Range)</h3>
        
        <div class="date-row" style="display: flex; gap: 16px;">
          <div class="field-group" style="flex: 1;">
            <label for="startDate"><strong>Start Date</strong></label>
            <input 
              type="date" 
              id="startDate" 
              class="input-field" 
              [(ngModel)]="weeklyTask.startDate" 
              name="startDate" 
              required
              style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px;"
            >
          </div>

          <div class="field-group" style="flex: 1;">
            <label for="endDate"><strong>End Date</strong></label>
            <input 
              type="date" 
              id="endDate" 
              class="input-field" 
              [(ngModel)]="weeklyTask.endDate" 
              name="endDate" 
              required
              style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px;"
            >
          </div>
        </div>
      </div>

      <!-- Grade Groups Breakdown -->
      <div class="grade-sections">
        <div class="task-box" *ngFor="let group of classGroups" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
          <h4 class="group-title" style="margin-bottom: 10px; color: #0284c7;">{{ group }}</h4>
          
          <div class="form-group" style="margin-bottom: 10px;">
            <label>Session Planner:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].session_planner" 
              [name]="'planner_' + group" 
              placeholder="Enter planner name" 
              class="form-control"
              style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 4px;"
            />
          </div>

          <div class="form-group" style="margin-bottom: 10px;">
            <label>Topic:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].session_topic" 
              [name]="'topic_' + group" 
              placeholder="Enter session topic" 
              class="form-control"
              style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 4px;"
            />
          </div>

          <div class="form-group" style="margin-bottom: 10px;">
            <label>Activity:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].activity" 
              [name]="'activity_' + group" 
              placeholder="Enter activity description" 
              class="form-control"
              style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 4px;"
            />
          </div>

          <div class="form-group">
            <label>Gifts & Props:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].gifts_props" 
              [name]="'gifts_' + group" 
              placeholder="Enter gifts or props needed" 
              class="form-control"
              style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 4px;"
            />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="submit-btn" [disabled]="isSubmitting" style="padding: 10px 20px; background-color: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer;">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Plan' : 'Save Plan') }}
        </button>
        <button type="button" (click)="goBack()" class="cancel-btn" style="padding: 10px 20px; background-color: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer;">
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
