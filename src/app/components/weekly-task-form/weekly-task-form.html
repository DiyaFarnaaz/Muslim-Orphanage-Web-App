<div class="page-container mobile-animate">
  <!-- Navigation Header Wrapper -->
  <div class="header-nav">
    <button type="button" (click)="goBack()" class="back-btn">&larr; Back</button>
  </div>

  <div class="form-container">
    <h2>{{ isEditMode ? 'Edit Weekly Plan' : 'Add New Weekly Plan' }}</h2>

    <form (ngSubmit)="saveTask()">
      
      <!-- General Details Card with Calendar Pickers -->
      <div class="report-card general-info">
        <h3>General Details (Date Range)</h3>
        
        <div class="date-row">
          <div class="field-group">
            <label for="startDate"><strong>Start Date</strong></label>
            <input 
              type="date" 
              id="startDate" 
              class="input-field" 
              [(ngModel)]="weeklyTask.startDate" 
              name="startDate" 
              required
            >
          </div>

          <div class="field-group">
            <label for="endDate"><strong>End Date</strong></label>
            <input 
              type="date" 
              id="endDate" 
              class="input-field" 
              [(ngModel)]="weeklyTask.endDate" 
              name="endDate" 
              required
            >
          </div>
        </div>
      </div>

      <!-- Grade Groups Breakdown -->
      <div class="grade-sections">
        <div class="task-box report-card" *ngFor="let group of classGroups">
          <h4 class="group-title">{{ group }}</h4>
          
          <div class="field-group">
            <label>Session Planner:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].session_planner" 
              [name]="'planner_' + group" 
              placeholder="Enter planner name" 
              class="input-field"
            />
          </div>

          <div class="field-group">
            <label>Topic:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].session_topic" 
              [name]="'topic_' + group" 
              placeholder="Enter session topic" 
              class="input-field"
            />
          </div>

          <div class="field-group">
            <label>Activity:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].activity" 
              [name]="'activity_' + group" 
              placeholder="Enter activity description" 
              class="input-field"
            />
          </div>

          <div class="field-group">
            <label>Gifts & Props:</label>
            <input 
              type="text" 
              [(ngModel)]="tasksData[group].gifts_props" 
              [name]="'gifts_' + group" 
              placeholder="Enter gifts or props needed" 
              class="input-field"
            />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons-row">
        <button type="submit" class="save-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Plan' : 'Save Plan') }}
        </button>
        <button type="button" (click)="goBack()" class="cancel-btn">
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
