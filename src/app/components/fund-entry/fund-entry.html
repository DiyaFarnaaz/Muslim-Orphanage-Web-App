<div class="fund-entry-container mobile-animate">
  <!-- Navigation Header with Back Button -->
  <div class="header-nav">
    <button type="button" (click)="goBack()" class="back-btn">
      &larr; Back
    </button>
  </div>

  <h2>{{ isEditMode ? 'Edit Fund Entry' : 'Add Fund Entry' }}</h2>
  
  <div *ngIf="loading" class="loading-state">
    <p>Loading entry details...</p>
  </div>

  <form *ngIf="!loading" (ngSubmit)="submitEntry()" #fundForm="ngForm" class="entry-form">
    
    <!-- Date field -->
    <div class="form-group">
      <label>Date</label>
      <input type="date" [(ngModel)]="newEntry.date" name="date" required class="form-control">
    </div>

    <div class="form-group">
      <label>Type</label>
      <select [(ngModel)]="newEntry.type" name="type" required class="form-control">
        <option value="income">Income (Donation/Fund)</option>
        <option value="expense">Expense (Usage)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" [(ngModel)]="newEntry.amount" name="amount" required class="form-control" placeholder="Enter amount">
    </div>

    <div class="form-group">
      <label>Description / Notes</label>
      <textarea [(ngModel)]="newEntry.description" name="description" class="form-control" placeholder="Optional details"></textarea>
    </div>

    <button type="submit" class="submit-btn" [disabled]="!fundForm.form.valid">
      {{ isEditMode ? 'Update Entry' : 'Save Entry' }}
    </button>
  </form>
</div>
