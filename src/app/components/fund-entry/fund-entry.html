<div class="page-container">
  <h2>Add New Transaction</h2>
  <header class="page-header">
    <!-- Navigate back to the Fundraiser dashboard -->
    <button class="back-btn" routerLink="/fundraisers">← Back </button>
    <h2>Add New Entry</h2>
  </header>
  <form (ngSubmit)="submitEntry()" #entryForm="ngForm" class="report-card">
    <div class="form-group">
      <label>Type</label>
      <select [(ngModel)]="newEntry.type" name="type" required>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" [(ngModel)]="newEntry.amount" name="amount" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <input type="text" [(ngModel)]="newEntry.description" name="description" required>
    </div>

    <button type="submit" [disabled]="!entryForm.valid" class="save-btn">Save Entry</button>
  </form>
</div>
