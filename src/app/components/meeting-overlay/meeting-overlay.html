<div
  class="meeting-overlay"
  [class.hidden]="!meeting.isActive()"
  [class.full]="meeting.mode() === 'full'"
  [class.floating]="meeting.mode() === 'floating'"
  [class.external]="meeting.mode() === 'external'"
  cdkDrag
  [cdkDragDisabled]="meeting.mode() !== 'floating'"
  (cdkDragEnded)="onDragEnded($event)">

  <!-- Dedicated drag handle bar at the top of the floating card -->
  <div class="drag-handle" cdkDragHandle *ngIf="meeting.mode() === 'floating'">
    <span class="drag-dots">••• Drag to move •••</span>
    <button class="expand-btn" (click)="meeting.expand()" title="Expand to full screen">⛶</button>
  </div>

  <div #jitsiHost class="jitsi-host">
    <div #jitsiContainer class="jitsi-container"></div>
  </div>

  <ng-container *ngIf="meeting.mode() === 'full'">
    <app-meeting-toolbar (toggleParticipantsClick)="toggleParticipants()"></app-meeting-toolbar>

    <app-meeting-participants
      *ngIf="showParticipants"
      (closePanel)="toggleParticipants()"></app-meeting-participants>

    <app-meeting-chat *ngIf="meeting.isChatOpen()"></app-meeting-chat>
  </ng-container>

  <app-floating-player *ngIf="meeting.mode() === 'floating'"></app-floating-player>

  <div class="external-pip-placeholder" *ngIf="meeting.mode() === 'external'">
    <span>Playing in Picture-in-Picture</span>
  </div>
</div>
