<div class="page-container mobile-animate">
  <div class="header-nav">
    <button type="button" class="back-btn" (click)="goBack()">&larr; Back</button>
  </div>

  <div class="form-container" *ngIf="!isLoading; else loadingTemplate">
    <h2>{{ isEditMode ? 'Edit Session Plan' : 'Add New Session Plan' }}</h2>

    <form (ngSubmit)="saveMeeting()">
      <!-- General Details Card -->
      <div class="report-card general-info">
        <h3>General Details</h3>
        
        <div class="field-group">
          <label for="meeting_date">Meeting Date</label>
          <input 
            type="date" 
            id="meeting_date" 
            class="input-field" 
            [(ngModel)]="meeting.meeting_date" 
            name="meeting_date" 
            required>
        </div>
      </div>

      <!-- Class Group Cards -->
      <div *ngFor="let group of classGroups" class="report-card group-card">
        <h3 class="group-title">{{ group }}</h3>

        <div class="field-group">
          <label>Session Lead(s)</label>
          <input 
            type="text" 
            class="input-field" 
            [(ngModel)]="tasksData[group].session_lead" 
            [name]="'lead_' + group" 
            placeholder="Leads names...">
        </div>

        <div class="field-group">
          <label>Session Topic</label>
          <textarea 
            class="input-field textarea-field" 
            [(ngModel)]="tasksData[group].session_topic" 
            [name]="'topic_' + group" 
            rows="3" 
            placeholder="Topic details and guidelines..."></textarea>
        </div>

        <div class="field-group">
          <label>Activity & Games</label>
          <textarea 
            class="input-field textarea-field" 
            [(ngModel)]="tasksData[group].activity" 
            [name]="'activity_' + group" 
            rows="3" 
            placeholder="Activities..."></textarea>
        </div>

        <div class="field-row-double">
          <div class="field-group">
            <label>Gifts</label>
            <input 
              type="text" 
              class="input-field" 
              [(ngModel)]="tasksData[group].gifts" 
              [name]="'gifts_' + group" 
              placeholder="Gifts required...">
          </div>

          <div class="field-group">
            <label>Props</label>
            <input 
              type="text" 
              class="input-field" 
              [(ngModel)]="tasksData[group].props" 
              [name]="'props_' + group" 
              placeholder="Props required...">
          </div>
        </div>

        <div class="field-group">
          <label>Remarks</label>
          <input 
            type="text" 
            class="input-field" 
            [(ngModel)]="tasksData[group].remarks" 
            [name]="'remarks_' + group" 
            placeholder="Add remarks...">
        </div>

        <div class="field-group">
          <label>Session Documents</label>
          <input 
            type="file" 
            class="input-field file-input" 
            multiple 
            (change)="onFilesSelected($event, group)">
          <small class="file-success-text" *ngIf="tasksData[group].docCount > 0">
            {{ tasksData[group].docCount }} file(s) attached successfully
          </small>
        </div>
      </div>

      <!-- Save Button Container -->
      <div class="field-group">
        <button type="submit" class="save-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Session Plan' : 'Save Session Plan') }}
        </button>
      </div>
    </form>
  </div>

  <ng-template #loadingTemplate>
    <div class="loading-state">
      <p>Loading session plan details...</p>
    </div>
  </ng-template>
</div>
