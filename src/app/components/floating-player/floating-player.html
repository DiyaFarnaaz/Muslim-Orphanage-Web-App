<div class="floating-player" (click)="$event.stopPropagation()">
  <!-- Live Chat Badge Notification Overlay -->
  <div class="floating-badge-overlay" *ngIf="meeting.unreadCount() > 0" (click)="meeting.toggleChat()">
    💬 {{ meeting.unreadCount() }} new message(s)
  </div>

  <!-- Live Emoji Reaction Pop-up -->
  <div class="floating-reaction-toast" *ngIf="meeting.latestReaction() as reaction">
    <span class="emoji">{{ reaction.emoji }}</span>
  </div>

  <button type="button" (click)="meeting.toggleAudio()" [title]="meeting.isAudioMuted() ? 'Unmute' : 'Mute'">
    {{ meeting.isAudioMuted() ? '🔇' : '🎤' }}
  </button>
  <button type="button" (click)="meeting.toggleVideo()" [title]="meeting.isVideoMuted() ? 'Start video' : 'Stop video'">
    {{ meeting.isVideoMuted() ? '📷' : '📹' }}
  </button>
  <button type="button" (click)="meeting.expand()" title="Expand back to full screen">⤢</button>
  <button type="button" class="danger" (click)="meeting.leaveCall()" title="Leave call">✕</button>
</div>
